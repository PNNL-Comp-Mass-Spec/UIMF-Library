name: MSBuild

on: [push]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: UIMFLibrary.sln

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # avoid shallow clone so NerdBank.GitVersioning can calculate version

    - name: Verify commit exists in origin/master
      run: git branch --remote --contains | grep origin/master

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /t:restore /t:build /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}

    - name: Archive compiled binaries for .NET 4.7.2
      uses: actions/upload-artifact@v7
      with:
        name: Compiled binaries, .NET 4.7.2
        path: UIMFLibrary/bin/Release/net472/*.*

    - name: Archive compiled binaries for .NET 4.8
      uses: actions/upload-artifact@v7
      with:
        name: Compiled binaries, .NET 4.8
        path: UIMFLibrary/bin/Release/net48/*.*

    - name: Archive compiled binaries for .NET Standard 2.0
      uses: actions/upload-artifact@v7
      with:
        name: Compiled binaries, .NET Standard 2.0
        path: UIMFLibrary/bin/Release/netstandard2.0/*.*

    - name: Archive compiled binaries for .NET Standard 2.1
      uses: actions/upload-artifact@v7
      with:
        name: Compiled binaries, .NET Standard 2.1
        path: UIMFLibrary/bin/Release/netstandard2.1/*.*

    - name: Archive compiled .nupkg
      uses: actions/upload-artifact@v7
      with:
        name: Compiled .nupkg
        path: UIMFLibrary/bin/Release/*.nupkg

    - name: Push NuGet package, login
      id: login
      uses: NuGet/login@v1
      with:
        # Use your NuGet.org profile username (NOT your email address)
        user: PNNLCompMassSpec

    - name: Push package to NuGet.org
      working-directory: ./UIMFLibrary/bin/Release/
      run: dotnet nuget push UIMFLibrary.*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
